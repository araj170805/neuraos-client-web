# Firebase App Hosting config for the alpha deploy (swaindhruti/neuraos-client-web, branch alpha-launch).
# Credentials come from the App Hosting service account; never set GOOGLE_APPLICATION_CREDENTIALS here.
runConfig:
  minInstances: 1
  maxInstances: 10
  concurrency: 80

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyBrJwW-4ySBqoMx2tm3Dh4wa5kGtmGpppM"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "neuraos.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "neuraos"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "neuraos.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "1078342157419"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:1078342157419:web:29b144d4cabd3d6de81d2e"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIRESTORE_DATABASE_ID
    value: "neuraos"
    availability:
      - BUILD
      - RUNTIME
  - variable: GOOGLE_CLOUD_PROJECT
    value: "neuraos"
    availability:
      - RUNTIME
  - variable: GOOGLE_CLOUD_LOCATION
    value: "global"
    availability:
      - RUNTIME
  - variable: GEMINI_ANSWER_MODEL
    value: "gemini-3.8-flash"
    availability:
      - RUNTIME
  - variable: GEMINI_FAST_MODEL
    value: "gemini-3.5-flash-lite"
    availability:
      - RUNTIME
